[project]
name = "anime_parser"
version = "0.1.0"
description = "Anime parsing and normalization module"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setup.packages.find]
where = ["src"]